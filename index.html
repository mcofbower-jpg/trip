    const compressImageToBase64 = (file, maxDim = 1280) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
            const base64Data = dataUrl.split(',')[1];
            resolve({ dataUrl, base64Data, mimeType: 'image/jpeg' });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

    function App() {

      // 從手機/瀏覽器 localStorage 讀取上次保存的資料

      // 青茂停車場設定（自動保存）

      // 當資料有變動時，自動寫入瀏覽器 localStorage

      // 實時時鐘（每 30 秒刷新一次泊車計費）
      const [nowTimestamp, setNowTimestamp] = useState(() => Date.now());
      useEffect(() => {
        const timer = setInterval(() => setNowTimestamp(Date.now()), 30000);

      }, []);

      // 計算青茂泊車費（08:00-20:00 MOP$6/hr，20:00-08:00 MOP$3/hr）
      const calculateParkingFee = (startMs, endMs, config) => {
        if (!startMs || !endMs || endMs <= startMs) {
          return { totalHours: 0, dayHours: 0, nightHours: 0, dayFeeMOP: 0, nightFeeMOP: 0, totalMOP: 0, totalRMB: 0 };
        }
        const totalHours = Math.ceil((endMs - startMs) / (1000 * 60 * 60));
        let dayHours = 0;
        let nightHours = 0;

        for (let i = 0; i < totalHours; i++) {
          const hourStartMs = startMs + i * 3600 * 1000;
          const hr = new Date(hourStartMs).getHours();
          const isDaytime = hr >= config.dayStartHour && hr < config.nightStartHour;
          if (isDaytime) dayHours += 1;
          else nightHours += 1;
        }

        const dayFeeMOP = dayHours * config.dayRateMOP;
        const nightFeeMOP = nightHours * config.nightRateMOP;
        const totalMOP = dayFeeMOP + nightFeeMOP;
        const totalRMB = Number((totalMOP * config.mopToRmbRate).toFixed(2));

        return { totalHours, dayHours, nightHours, dayFeeMOP, nightFeeMOP, totalMOP, totalRMB };
      };

      const parkingStats = useMemo(() => {
        const startMs = new Date(`${parkingConfig.entryDate}T${parkingConfig.entryTime || '00:00'}:00`).getTime();
        const plannedEndMs = new Date(`${parkingConfig.exitDate}T${parkingConfig.exitTime || '23:59'}:00`).getTime();
        const fullTripCalc = calculateParkingFee(startMs, plannedEndMs, parkingConfig);

        const effectiveNowMs = Math.min(nowTimestamp, plannedEndMs);
        const isStarted = nowTimestamp > startMs;
        const isEnded = nowTimestamp >= plannedEndMs;
        const realtimeCalc = isStarted ? calculateParkingFee(startMs, effectiveNowMs, parkingConfig) : null;

        return { startMs, plannedEndMs, isStarted, isEnded, fullTripCalc, realtimeCalc };
      }, [parkingConfig, nowTimestamp]);

      // 表單狀態
      const [editingId, setEditingId] = useState(null);
      const [formData, setFormData] = useState({
        date: '2026-11-15',
        region: 'NANNING',
        subLocation: '珠海/青茂口岸',
        customSubLocation: '',

        amount: '',

      });

      const [toastMessage, setToastMessage] = useState(null);
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 2600);
      };

      // =====================================================================
      // AI 圖片識別核心邏輯：判斷是「消費帳單」、「高鐵票/機票」或「青茂泊車」
      // =====================================================================
      const analyzeImageWithGemini = async (base64ImageData, mimeType) => {
        const apiKey = "";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        const prompt = `你是一個專門協助「2026年11月15日至11月24日 廣西南寧與雲南旅行」的智慧識別助手。
請仔細分析使用者上傳的圖片（可能是微信支付/支付寶帳單截圖、餐廳收據、美團/攜程訂單、12306高鐵票、機票行程單、或澳門青茂停車場紀錄），並轉換為指定的 JSON 格式：

1. docType 判斷規則：
   - 若為高鐵車票/12306截圖：設為 "HSR_TICKET"
   - 若為機票/航班行程單：設為 "FLIGHT_TICKET"
   - 若為停車場入閘/繳費紀錄：設為 "PARKING_RECORD"
   - 其他一般消費帳單、收據、轉帳或付款截圖：設為 "EXPENSE_RECEIPT"

2. 日期對齊規則 (date)：
   - 旅程日期為 2026-11-15 至 2026-11-24。若圖片中出現 11月15日~11月24日，請輸出對應的 "2026-11-XX"。若無日期或不在範圍內，預設輸出 "${selectedDate === 'ALL' ? '2026-11-15' : selectedDate}"。

3. 地區與地點判斷 (region & subLocation)：
   - region 只能是 "NANNING" 或 "YUNNAN"。
   - 若屬於南寧/珠海/澳門，region 為 "NANNING"，subLocation 請從 ["珠海/青茂口岸", "青秀區/萬象城", "三街兩巷/朝陽", "青秀山/邕江", "南寧東站/機場", "南寧其他"] 選擇最接近的一項；若選 "南寧其他"，請在 customSubLocation 填入圖片上的具體地點。
   - 若屬於雲南（麗江/大理/香格里拉/昆明等），region 為 "YUNNAN"，subLocation 請從 ["麗江", "大理", "香格里拉", "昆明", "西雙版納/瀘沽湖", "雲南城際交通", "雲南其他"] 選擇；若選 "雲南其他"，請在 customSubLocation 填入具體地點。

4. 類別判斷 (category)：
   - 只能從 ["dining", "snacks_coffee", "local_transit", "intercity_transit", "lodging", "tickets", "shopping", "misc"] 中選擇。

5. 支付管道判斷 (paymentChannel)：
   - 只能從 ["wechat", "alipay", "ota_prepaid", "unionpay", "cash", "other_pay"] 中選擇。

6. 交通時刻識別 (transitData)：
   - 若為高鐵票或機票，請提取車次/航班號 (codeNo，如 D3842、G2942、GX8851)、出發時間 (depTime, HH:mm 24小時制)、抵達時間 (arrTime, HH:mm 24小時制)、出發與抵達站點、以及車廂座位或航廈備註 (seatNote)。
   - transitTarget：若為去程高鐵(11/15前後或往南寧)設為 "outboundHSR"；若為飛麗江航班(11/17前後)設為 "lijiangFlight"；若為返程高鐵(11/24前後或回珠海)設為 "returnHSR"；若為青茂泊車設為 "qingmaoParking"；其他設為 "otherTransit"。`;

        const payload = {
          contents: [
            {
              role: "user",
              parts: [
                { text: prompt },
                {
                  inlineData: {
                    mimeType: mimeType,
                    data: base64ImageData
                  }
                }
              ]
            }
          ],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                docType: { type: "STRING" },
                summary: { type: "STRING" },
                hasExpense: { type: "BOOLEAN" },
                date: { type: "STRING" },
                amount: { type: "NUMBER" },
                region: { type: "STRING" },
                subLocation: { type: "STRING" },
                customSubLocation: { type: "STRING" },
                category: { type: "STRING" },
                customCategory: { type: "STRING" },
                paymentChannel: { type: "STRING" },
                customPayment: { type: "STRING" },
                note: { type: "STRING" },
                isTransit: { type: "BOOLEAN" },
                transitTarget: { type: "STRING" },
                codeNo: { type: "STRING" },
                depTime: { type: "STRING" },
                arrTime: { type: "STRING" },
                seatNote: { type: "STRING" },
                parkingEntryTime: { type: "STRING" },
                parkingExitTime: { type: "STRING" }
              },
              required: [
                "docType",
                "summary",
                "hasExpense",
                "date",
                "amount",
                "region",
                "subLocation",
                "category",
                "paymentChannel",
                "note",
                "isTransit"
              ]
            }
          }
        };

        const delays = [1000, 2000, 4000];
        let lastError = null;
        for (let attempt = 0; attempt <= delays.length; attempt++) {
          try {
            const response = await fetch(apiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            const result = await response.json();
            const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!jsonText) throw new Error("無法解析回應內容");
            return JSON.parse(jsonText);
          } catch (err) {
            lastError = err;
            if (attempt < delays.length) {
              await new Promise((r) => setTimeout(r, delays[attempt]));
            }
          }
        }
        throw lastError;
      };

      const handleUploadImageForAI = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        e.target.value = '';

        setShowScannerModal(true);
        setIsScanning(true);
        setScanError(null);
        setScanResult(null);

        try {
          const { dataUrl, base64Data, mimeType } = await compressImageToBase64(file);
          setScanPreviewUrl(dataUrl);
          const parsed = await analyzeImageWithGemini(base64Data, mimeType);

          // 確保日期落在 10 天行程內，否則預設為當前選中日期
          const validDate = TRIP_DAYS.some((d) => d.date === parsed.date)
            ? parsed.date
            : selectedDate === 'ALL'
            ? '2026-11-15'
            : selectedDate;

          const validRegion = parsed.region === 'YUNNAN' ? 'YUNNAN' : 'NANNING';
          const allowedLocs = REGIONS[validRegion].subLocations;
          const validSubLoc = allowedLocs.includes(parsed.subLocation)
            ? parsed.subLocation
            : allowedLocs[allowedLocs.length - 1];

          setScanResult({
            ...parsed,
            date: validDate,
            region: validRegion,
            subLocation: validSubLoc,
            amount: Number(parsed.amount) || 0
          });
        } catch (err) {
          setScanError('圖片識別失敗，請確認網路連線或換一張清晰的截圖再試一次。');
        } finally {
          setIsScanning(false);
        }
      };

      // 將 AI 識別到的結果直接套用到「交通時刻表 / 青茂泊車」與「消費帳單」
      const applyScanResult = ({ saveExpenseNow = true, saveTransitNow = true, openFormToEdit = false }) => {
        if (!scanResult) return;

        // 1. 若需要更新高鐵/機票/泊車時刻表
        if (saveTransitNow && scanResult.isTransit) {
          if (scanResult.transitTarget === 'outboundHSR') {
            setTransitSchedule((prev) => ({
              ...prev,
              outboundHSR: {
                ...prev.outboundHSR,
                trainNo: scanResult.codeNo || prev.outboundHSR.trainNo,
                depTime: scanResult.depTime || prev.outboundHSR.depTime,
                arrTime: scanResult.arrTime || prev.outboundHSR.arrTime,
                seatNote: scanResult.seatNote || prev.outboundHSR.seatNote
              }
            }));
          } else if (scanResult.transitTarget === 'lijiangFlight') {
            setTransitSchedule((prev) => ({
              ...prev,
              lijiangFlight: {
                ...prev.lijiangFlight,
                flightNo: scanResult.codeNo || prev.lijiangFlight.flightNo,
                depTime: scanResult.depTime || prev.lijiangFlight.depTime,
                arrTime: scanResult.arrTime || prev.lijiangFlight.arrTime,
                seatNote: scanResult.seatNote || prev.lijiangFlight.seatNote
              }
            }));
          } else if (scanResult.transitTarget === 'returnHSR') {
            setTransitSchedule((prev) => ({
              ...prev,
              returnHSR: {
                ...prev.returnHSR,
                trainNo: scanResult.codeNo || prev.returnHSR.trainNo,
                depTime: scanResult.depTime || prev.returnHSR.depTime,
                arrTime: scanResult.arrTime || prev.returnHSR.arrTime,
                seatNote: scanResult.seatNote || prev.returnHSR.seatNote
              }
            }));
          } else if (scanResult.transitTarget === 'qingmaoParking' || scanResult.docType === 'PARKING_RECORD') {
            setParkingConfig((prev) => ({
              ...prev,
              entryTime: scanResult.parkingEntryTime || scanResult.depTime || prev.entryTime,
              exitTime: scanResult.parkingExitTime || scanResult.arrTime || prev.exitTime
            }));
          }
        }

        // 2. 若選擇帶入表單微調
        if (openFormToEdit) {
          setEditingId(null);
          setFormData({
            date: scanResult.date,
            region: scanResult.region,
            subLocation: scanResult.subLocation,
            customSubLocation: scanResult.customSubLocation || '',
            category: CATEGORIES.some((c) => c.id === scanResult.category) ? scanResult.category : 'misc',
            customCategory: scanResult.customCategory || '',
            paymentChannel: PAYMENT_CHANNELS.some((p) => p.id === scanResult.paymentChannel)
              ? scanResult.paymentChannel
              : 'wechat',
            customPayment: scanResult.customPayment || '',
            amount: scanResult.amount > 0 ? String(scanResult.amount) : '',
            reconciled: true,
            note: scanResult.note || scanResult.summary || ''
          });
          setShowScannerModal(false);
          setActivePage('add');
          showToast('已將 AI 識別內容帶入表單，確認後即可儲存');
          return;
        }

        // 3. 若直接新增消費入帳
        if (saveExpenseNow && scanResult.amount > 0) {
          const newEntry = {
            id: `exp-ai-${Date.now()}`,
            date: scanResult.date,
            region: scanResult.region,
            subLocation: scanResult.subLocation,
            customSubLocation: scanResult.customSubLocation || '',
            category: CATEGORIES.some((c) => c.id === scanResult.category) ? scanResult.category : 'misc',
            customCategory: scanResult.customCategory || '',
            paymentChannel: PAYMENT_CHANNELS.some((p) => p.id === scanResult.paymentChannel)
              ? scanResult.paymentChannel
              : 'wechat',
            customPayment: scanResult.customPayment || '',
            amount: Number(Number(scanResult.amount).toFixed(2)),
            reconciled: true,
            note: scanResult.note || scanResult.summary || 'AI 圖片識別帳目'
          };
          setExpenses((prev) => [newEntry, ...prev]);
          setSelectedDate(scanResult.date);
        }

        setShowScannerModal(false);
        if (saveTransitNow && scanResult.isTransit && (!saveExpenseNow || scanResult.amount <= 0)) {
          setActivePage('transit');
          showToast('已自動更新交通時刻 / 泊車設定！');
        } else if (saveTransitNow && scanResult.isTransit && saveExpenseNow && scanResult.amount > 0) {
          showToast(`已更新時刻表，並記下 ${formatRMB(scanResult.amount)}！`);
        } else {
          setActivePage('daily');
          showToast(`AI 識別成功！已新增 ${formatRMB(scanResult.amount)}`);
        }
      };

      const isOtherSubLocation = formData.subLocation.includes('其他');
      const isOtherCategory = formData.category === 'misc';
      const isOtherPayment = formData.paymentChannel === 'other_pay';

      const formatRMB = (val) => {
        const num = Number(val) || 0;
        return `¥${num.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      };

      const stats = useMemo(() => {
        let totalSpent = 0;
        let nanningSpent = 0;
        let yunnanSpent = 0;
        let reconciledTotal = 0;
        let pendingTotal = 0;

        const dailyMap = {};
        TRIP_DAYS.forEach((d) => {
          dailyMap[d.date] = {
            ...d,
            routeNote: dayRoutes[d.date] || d.defaultRoute,
            total: 0,
            count: 0,
            items: []
          };
        });

        const byPayment = {};
        PAYMENT_CHANNELS.forEach((p) => {
          byPayment[p.id] = { ...p, total: 0, reconciled: 0, pending: 0, count: 0, items: [] };
        });

        const byCategory = {};
        CATEGORIES.forEach((c) => {
          byCategory[c.id] = { ...c, total: 0, count: 0 };
        });

        expenses.forEach((item) => {
          const amt = Number(item.amount) || 0;
          totalSpent += amt;
          if (item.region === 'NANNING') nanningSpent += amt;
          else yunnanSpent += amt;

          if (item.reconciled) reconciledTotal += amt;
          else pendingTotal += amt;

          if (dailyMap[item.date]) {
            dailyMap[item.date].total += amt;
            dailyMap[item.date].count += 1;
            dailyMap[item.date].items.push(item);
          }

          if (byPayment[item.paymentChannel]) {
            byPayment[item.paymentChannel].total += amt;
            byPayment[item.paymentChannel].count += 1;
            byPayment[item.paymentChannel].items.push(item);
            if (item.reconciled) byPayment[item.paymentChannel].reconciled += amt;
            else byPayment[item.paymentChannel].pending += amt;
          }

          if (byCategory[item.category]) {
            byCategory[item.category].total += amt;
            byCategory[item.category].count += 1;
          }
        });

        return {
          totalSpent,
          nanningSpent,
          yunnanSpent,
          reconciledTotal,
          pendingTotal,
          tenDaysList: TRIP_DAYS.map((d) => dailyMap[d.date]),
          paymentList: Object.values(byPayment),
          categoryList: Object.values(byCategory).sort((a, b) => b.total - a.total)
        };

          customSubLocation: isOtherSubLocation ? formData.customSubLocation.trim() : '',

          note: formData.note.trim()

        if (editingId) {

          setSelectedDate(formData.date);

            amount: '',
            note: '',
            customSubLocation: '',
            customCategory: '',
            customPayment: ''

        const sorted = [...expenses].sort((a, b) => a.date.localeCompare(b.date));

          const dayMeta = TRIP_DAYS.find((d) => d.date === e.date);
          const regName = REGIONS[e.region]?.shortName || e.region;
          const locDisplay = e.customSubLocation ? `${e.subLocation}(${e.customSubLocation})` : e.subLocation;

          const payDisplay = e.customPayment ? `${basePayName}(${e.customPayment})` : basePayName;

            safeNote

                      </div>
                      <div>
                        <label className="block text-[11px] font-bold text-slate-500 mb-1">航廈 / 備註</label>

                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-bold text-slate-500 mb-1">座位 / 備註</label>

                          value={transitSchedule.returnHSR.seatNote}
                          onChange={(e) =>
                            setTransitSchedule({
                              ...transitSchedule,
                              returnHSR: { ...transitSchedule.returnHSR, seatNote: e.target.value }
                            })
                          }
                          className="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs text-slate-800"
                        />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* =============================================================== */}
            {/* 分頁 4：💳 支付對帳 */}
            {/* =============================================================== */}
            {activePage === 'payment' && (
              <div className="space-y-4">
                <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-4 border-b border-slate-100">
                    <div>
                      <h2 className="text-base font-extrabold text-slate-900">支付管道對帳中心</h2>
                      <p className="text-xs text-slate-500 mt-0.5">

                      </p>
                    </div>
                    <div className="flex items-center gap-2 text-xs font-mono">
                      <span className="px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-700 font-bold">
                        已核銷 {formatRMB(stats.reconciledTotal)}
                      </span>
                      <span className="px-2.5 py-1 rounded-lg bg-amber-50 text-amber-700 font-bold">
                        待核對 {formatRMB(stats.pendingTotal)}
                      </span>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
                    {stats.paymentList.map((pay) => {
                      const isSelected = selectedPaymentFilter === pay.id;
                      return (
                        <div
                          key={pay.id}
                          onClick={() => setSelectedPaymentFilter(isSelected ? null : pay.id)}
                          className={`cursor-pointer rounded-xl p-4 border transition flex items-center justify-between ${
                            isSelected
                              ? 'bg-slate-900 text-white border-slate-900 shadow-sm'
                              : 'bg-slate-50/70 hover:bg-white text-slate-800 border-slate-200'
                          }`}
                        >
                          <div className="flex items-center gap-3">
                            <div
                              className="w-10 h-10 rounded-xl flex items-center justify-center text-white text-lg shrink-0"
                              style={{ backgroundColor: pay.hex }}
                            >
                              {pay.emoji}
                            </div>
                            <div>
                              <div className="text-sm font-extrabold">{pay.name}</div>
                              <div className={`text-xs ${isSelected ? 'text-slate-300' : 'text-slate-400'}`}>
                                {pay.count} 筆消費
                              </div>
                            </div>
                          </div>

                          <div className="text-right">
                            <div className="text-lg font-black font-mono tabular-nums">
                              {formatRMB(pay.total)}
                            </div>
                            {pay.pending > 0 && (
                              <div className="text-[11px] text-amber-500 font-mono">
                                待核對 {formatRMB(pay.pending)}
                              </div>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {selectedPaymentFilter && (
                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
                    {(() => {
                      const payObj = stats.paymentList.find((p) => p.id === selectedPaymentFilter);
                      if (!payObj) return null;
                      return (
                        <>
                          <div className="flex items-center justify-between pb-3 mb-3 border-b border-slate-100">
                            <h3 className="text-sm font-extrabold text-slate-900">
                              「{payObj.name}」消費明細（共 {payObj.items.length} 筆）
                            </h3>
                            <button
                              onClick={() => setSelectedPaymentFilter(null)}
                              className="text-xs text-slate-500 hover:text-slate-800"
                            >
                              收起明細
                            </button>
                          </div>

                          {payObj.items.length === 0 ? (
                            <p className="text-xs text-slate-400 py-6 text-center">此支付管道目前尚無消費紀錄</p>
                          ) : (
                            <div className="divide-y divide-slate-100">
                              {payObj.items.map((item) => {
                                const dayMeta = TRIP_DAYS.find((d) => d.date === item.date);
                                const baseCatName = CATEGORIES.find((c) => c.id === item.category)?.name || '';
                                const displayTitle =
                                  item.note || (item.customCategory ? `${baseCatName} (${item.customCategory})` : baseCatName);
                                const displayLoc = item.customSubLocation
                                  ? `${item.subLocation} (${item.customSubLocation})`
                                  : item.subLocation;

                                return (
                                  <div key={item.id} className="py-3 flex items-center justify-between gap-3">
                                    <div>
                                      <div className="text-sm font-bold text-slate-900">{displayTitle}</div>
                                      <div className="text-xs text-slate-400 mt-0.5">
                                        {dayMeta ? `${dayMeta.shortDate} (${dayMeta.code})` : item.date} ·{' '}
                                        {REGIONS[item.region]?.shortName} ({displayLoc})

                                    </div>

                                    <div className="flex items-center gap-3">
                                      <span className="font-mono font-bold text-sm text-slate-900">

                                        }`}

                                        {item.reconciled ? '✓ 已核銷' : '標記已核對'}
                                      </button>
                                    </div>
                                  </div>
                                );

                            </div>

                      );

              </div>

                      const pct = stats.totalSpent > 0 ? (cat.total / stats.totalSpent) * 100 : 0;
                      return (
                        <div key={cat.id} className="flex items-center justify-between py-2 border-b border-slate-100 last:border-0">

                          </div>
                          <div className="text-right font-mono tabular-nums">
                            <div className="text-sm font-bold text-slate-900">{formatRMB(cat.total)}</div>
                            <div className="text-[11px] text-slate-400">{pct.toFixed(0)}%</div>
                          </div>
                        </div>
                      );
                    })}

                </div>

                {/* 匯出 CSV 與 JSON 備份 */}

                  </p>
                  <div className="flex flex-wrap gap-2.5">
                    <button
                      onClick={exportToCSV}
                      className="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center gap-1.5 transition"
                    >
                      <Icon name="download" className="w-4 h-4" />
                      <span>匯出 CSV 對帳表</span>
                    </button>
                    <button
                      onClick={exportToJSON}
                      className="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold flex items-center gap-1.5 transition"
                    >
                      <Icon name="download" className="w-4 h-4" />
                      <span>下載備份檔 (.json)</span>
                    </button>
                    <button
                      onClick={() => fileInputRef.current?.click()}
                      className="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold flex items-center gap-1.5 transition"
                    >
                      <Icon name="upload" className="w-4 h-4" />
                      <span>匯入備份檔</span>
                    </button>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* =============================================================== */}
          {/* 手機版專屬：底部固定大拇指導覽列（像原生手機 App 一樣順手） */}
          {/* =============================================================== */}
          <nav className="sm:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-[0_-4px_16px_rgba(15,23,42,0.06)] safe-bottom">
            <div className="grid grid-cols-5 items-center px-1 pt-1">
              {[
                { id: 'daily', label: '每日花費', icon: 'calendar' },
                { id: 'transit', label: '交通泊車', icon: 'train' },
                { id: 'add', label: editingId ? '修改' : '記一筆', icon: 'plus', isPrimary: true },
                { id: 'payment', label: '支付對帳', icon: 'card' },
                { id: 'summary', label: '統計備份', icon: 'chart' }
              ].map((tab) => {
                const isActive = activePage === tab.id;
                if (tab.isPrimary) {
                  return (
                    <button
                      key={tab.id}
                      onClick={() => {
                        if (!editingId && selectedDate !== 'ALL') {
                          const dayObj = TRIP_DAYS.find((d) => d.date === selectedDate);
                          if (dayObj) handleFormDayChange(dayObj);
                        }
                        setActivePage('add');
                        setTimeout(() => amountInputRef.current?.focus(), 80);
                      }}
                      className="flex flex-col items-center justify-center -mt-4"
                    >
                      <div className="w-12 h-12 rounded-2xl bg-emerald-600 active:bg-emerald-700 text-white shadow-lg shadow-emerald-600/30 flex items-center justify-center border-2 border-white">
                        <Icon name="plus" className="w-6 h-6" />
                      </div>
                      <span className="text-[10px] font-extrabold text-emerald-700 mt-0.5">
                        {tab.label}
                      </span>
                    </button>
                  );
                }
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActivePage(tab.id)}
                    className={`py-1.5 flex flex-col items-center justify-center gap-0.5 transition active:scale-95 ${
                      isActive ? 'text-slate-900 font-extrabold' : 'text-slate-400 font-medium'
                    }`}
                  >
                    <Icon name={tab.icon} className={`w-5 h-5 ${isActive ? 'text-emerald-600' : ''}`} />
                    <span className="text-[10px]">{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
