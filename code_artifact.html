    const compressImageToBase64 = (file, maxDim = 1280) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const rawDataUrl = e.target.result;
          const img = new Image();
          img.onload = () => {
            try {
              let width = img.width;
              let height = img.height;
              if (width > maxDim || height > maxDim) {
                if (width > height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
              const base64Data = dataUrl.split(',')[1];
              resolve({ dataUrl, base64Data, mimeType: 'image/jpeg' });
            } catch (err) {
              const parts = rawDataUrl.split(',');
              resolve({
                dataUrl: rawDataUrl,
                base64Data: parts[1] || '',
                mimeType: file.type || 'image/jpeg'
              });
            }
          };
          img.onerror = () => {
            const parts = rawDataUrl.split(',');
            resolve({
              dataUrl: rawDataUrl,
              base64Data: parts[1] || '',
              mimeType: file.type || 'image/jpeg'
            });
          };
          img.src = rawDataUrl;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    };

        return () => clearInterval(timer);
      }, []);

      const calculateParkingFee = (startMs, endMs, config) => {
        if (!startMs || !endMs || endMs <= startMs) {
          return { totalHours: 0, dayHours: 0, nightHours: 0, dayFeeMOP: 0, nightFeeMOP: 0, totalMOP: 0, totalRMB: 0 };
        }
        const totalHours = Math.ceil((endMs - startMs) / (1000 * 60 * 60));
        let dayHours = 0;
        let nightHours = 0;
        for (let i = 0; i < totalHours; i++) {
          const hourStartMs = startMs + i * 3600 * 1000;
          const hr = new Date(hourStartMs).getHours();
          if (hr >= config.dayStartHour && hr < config.nightStartHour) dayHours += 1;
          else nightHours += 1;
        }
        const dayFeeMOP = dayHours * config.dayRateMOP;
        const nightFeeMOP = nightHours * config.nightRateMOP;
        const totalMOP = dayFeeMOP + nightFeeMOP;
        const totalRMB = Number((totalMOP * config.mopToRmbRate).toFixed(2));
        return { totalHours, dayHours, nightHours, dayFeeMOP, nightFeeMOP, totalMOP, totalRMB };
      };

      const parkingStats = useMemo(() => {

        const effectiveNowMs = Math.min(nowTimestamp, plannedEndMs);
        const isStarted = nowTimestamp > startMs;
        const realtimeCalc = isStarted ? calculateParkingFee(startMs, effectiveNowMs, parkingConfig) : null;

      const parseRawTextToReceiptData = (rawText, fallbackDate) => {
        const cleanText = (rawText || '').replace(/\s+/g, ' ');
        let date = fallbackDate;
        const cnDateMatch = cleanText.match(/11\s*[月/\-.]\s*(1[5-9]|2[0-4])\s*日?/);
        if (cnDateMatch) {
          date = `2026-11-${cnDateMatch[1].padStart(2, '0')}`;
        }

        const trainMatch = cleanText.match(/\b([GDCTZ]\d{2,4})\b/i);
        const isHSR = Boolean(trainMatch) || /12306|高鐵|動車|二等座|一等座|檢票|車廂|南寧東|珠海站/.test(cleanText);
        const isFlight = /航班|機票|登機|起飛|三義機場|吳圩機場|航空/.test(cleanText);
        const isParking = /青茂|停車場|泊車|入場時間|離場時間/.test(cleanText);

        let docType = 'EXPENSE_RECEIPT';
        let isTransit = false;
        let transitTarget = 'outboundHSR';
        if (isHSR) {
          docType = 'HSR_TICKET';
          isTransit = true;
          transitTarget = date >= '2026-11-20' ? 'returnHSR' : 'outboundHSR';
        } else if (isFlight) {
          docType = 'FLIGHT_TICKET';
          isTransit = true;
          transitTarget = 'lijiangFlight';
        } else if (isParking) {
          docType = 'PARKING_RECORD';
          isTransit = true;
          transitTarget = 'qingmaoParking';
        }

        const timeMatches = [...cleanText.matchAll(/\b([01]?\d|2[0-3]):([0-5]\d)\b/g)].map(
          (m) => `${m[1].padStart(2, '0')}:${m[2]}`
        );
        const depTime = timeMatches[0] || '';
        const arrTime = timeMatches[1] || '';

        let amount = 0;
        const currencyMatches = [
          ...cleanText.matchAll(/[¥￥]\s*([0-9]{1,5}(?:\.[0-9]{1,2})?)/g),
          ...cleanText.matchAll(/(?:實付|合計|總計|金額|票價|支付|消費)[^0-9¥￥-]{0,6}[¥￥-]?\s*([0-9]{1,5}(?:\.[0-9]{1,2})?)/g),
          ...cleanText.matchAll(/([0-9]{1,5}(?:\.[0-9]{1,2})?)\s*元/g)
        ];
        for (const m of currencyMatches) {
          const val = parseFloat(m[1]);
          if (!isNaN(val) && val > 0 && val < 50000 && val !== 2026 && val !== 12306) {
            amount = val;
            break;
          }
        }
        if (amount === 0) {
          const decimalMatch = cleanText.match(/\b([1-9][0-9]{0,4}\.[0-9]{2})\b/);
          if (decimalMatch) {
            const val = parseFloat(decimalMatch[1]);
            if (val > 0 && val < 30000) amount = val;
          }
        }

        let region = date >= '2026-11-18' ? 'YUNNAN' : 'NANNING';
        let subLocation = region === 'YUNNAN' ? '麗江' : '青秀區/萬象城';
        if (/麗江|玉龍|束河|白沙/.test(cleanText)) { region = 'YUNNAN'; subLocation = '麗江'; }
        else if (/大理|洱海|雙廊/.test(cleanText)) { region = 'YUNNAN'; subLocation = '大理'; }
        else if (/香格里拉|獨克宗/.test(cleanText)) { region = 'YUNNAN'; subLocation = '香格里拉'; }
        else if (/昆明|長水/.test(cleanText)) { region = 'YUNNAN'; subLocation = '昆明'; }
        else if (/珠海|青茂/.test(cleanText)) { region = 'NANNING'; subLocation = '珠海/青茂口岸'; }

        let paymentChannel = 'wechat';
        if (/支付寶|Alipay/i.test(cleanText)) paymentChannel = 'alipay';
        else if (/12306|攜程|美團/.test(cleanText)) paymentChannel = 'ota_prepaid';
        else if (/雲閃付|銀聯|銀行卡/.test(cleanText)) paymentChannel = 'unionpay';
        else if (/現金/.test(cleanText)) paymentChannel = 'cash';

        let category = 'dining';
        if (isHSR || isFlight) category = 'intercity_transit';
        else if (isParking || /打車|地鐵|公交/.test(cleanText)) category = 'local_transit';
        else if (/酒店|客棧|民宿|住宿/.test(cleanText)) category = 'lodging';
        else if (/門票|索道|景區/.test(cleanText)) category = 'tickets';
        else if (/咖啡|奶茶|茶飲/.test(cleanText)) category = 'snacks_coffee';
        else if (/伴手禮|特產|超市/.test(cleanText)) category = 'shopping';

        const codeNo = trainMatch ? trainMatch[1].toUpperCase() : '';
        const catObj = CATEGORIES.find((c) => c.id === category) || CATEGORIES[0];
        const note = isHSR ? `高鐵車票 ${codeNo}`.trim() : isFlight ? '機票行程' : `${catObj.name}消費`;

        return {
          docType,
          summary: `已自動提取：${formatMonthDayCN(date)} ${amount > 0 ? `消費 ¥${amount.toFixed(2)}` : note}`,
          hasExpense: amount > 0,
          date,
          amount,
          region,
          subLocation,
          customSubLocation: '',
          category,
          customCategory: '',
          paymentChannel,
          customPayment: '',
          note,
          isTransit,
          transitTarget,
          codeNo,
          depTime,
          arrTime,
          seatNote: ''
        };
      };

      const analyzeImageWithGemini = async (base64ImageData, mimeType, fallbackDate) => {
        const activeKey = (userGeminiKey || '').trim();
        if (!activeKey) throw new Error('NO_API_KEY');
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${activeKey}`;
        const prompt = `分析這張圖片（帳單、收據、高鐵票、機票或停車收據），只輸出純 JSON 物件：
{
  "docType": "HSR_TICKET" 或 "FLIGHT_TICKET" 或 "PARKING_RECORD" 或 "EXPENSE_RECEIPT",
  "summary": "摘要",
  "hasExpense": true,
  "date": "2026-11-XX 或 ${fallbackDate}",
  "amount": 數字金額若無填0,
  "region": "NANNING" 或 "YUNNAN",
  "subLocation": "地點",
  "category": "dining"|"snacks_coffee"|"local_transit"|"intercity_transit"|"lodging"|"tickets"|"shopping"|"misc",
  "paymentChannel": "wechat"|"alipay"|"ota_prepaid"|"unionpay"|"cash"|"other_pay",
  "note": "備註",
  "isTransit": true/false,
  "transitTarget": "outboundHSR"|"lijiangFlight"|"returnHSR"|"qingmaoParking",
  "codeNo": "車次航班號",
  "depTime": "HH:mm",
  "arrTime": "HH:mm"
}`;

        const response = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: prompt }, { inlineData: { mimeType, data: base64ImageData } }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });
        if (!response.ok) throw new Error('API_HTTP_ERROR');
        const result = await response.json();
        const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        return JSON.parse(rawText.replace(/```json|```/gi, '').trim());
      };

      const handleUploadImageForAI = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const defaultDate = selectedDate === 'ALL' ? '2026-11-15' : selectedDate;
        setShowScannerModal(true);
        setIsScanning(true);
        setScanStatusText('正在讀取並分析圖片內容...');
        setScanError(null);
        setScanResult(null);
        setDetectedBannerText('');

        try {
          const { dataUrl, base64Data, mimeType } = await compressImageToBase64(file);
          setScanPreviewUrl(dataUrl);

          let parsed = null;
          try {
            parsed = await analyzeImageWithGemini(base64Data, mimeType, defaultDate);
          } catch {
            setScanStatusText('正在使用本地離線識別引擎解析...');
            // 載入輕量 Tesseract 離線 OCR
            const Tesseract = await new Promise((resolve, reject) => {
              if (window.Tesseract) return resolve(window.Tesseract);
              const script = document.createElement('script');
              script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
              script.onload = () => resolve(window.Tesseract);
              script.onerror = reject;
              document.head.appendChild(script);
            });
            const { data } = await Tesseract.recognize(dataUrl, 'chi_tra+chi_sim+eng');
            parsed = parseRawTextToReceiptData(data?.text || '', defaultDate);
          }

          let validDate = defaultDate;
          if (parsed?.date) {
            const dayMatch = String(parsed.date).match(/(1[5-9]|2[0-4])$/);
            if (dayMatch) validDate = `2026-11-${dayMatch[1]}`;
          }

          const validRegion = parsed?.region === 'YUNNAN' ? 'YUNNAN' : 'NANNING';
          const allowedLocs = REGIONS[validRegion].subLocations;
          const validSubLoc = allowedLocs.includes(parsed?.subLocation) ? parsed.subLocation : allowedLocs[0];
          const finalAmount = Number(parsed?.amount) || 0;
          const finalNote = parsed?.note || parsed?.summary || '圖片識別帳目';
          const monthDayStr = formatMonthDayCN(validDate);

          const finalResult = {
            ...parsed,
            date: validDate,
            region: validRegion,
            subLocation: validSubLoc,
            category: CATEGORIES.some((c) => c.id === parsed?.category) ? parsed.category : 'dining',
            paymentChannel: PAYMENT_CHANNELS.some((p) => p.id === parsed?.paymentChannel) ? parsed.paymentChannel : 'wechat',
            amount: finalAmount,
            note: finalNote
          };

          setScanResult(finalResult);
          const bannerMsg = finalAmount > 0
            ? `已檢測到：${monthDayStr} 消費 ¥${finalAmount.toFixed(2)} 元（${finalNote}）`
            : finalResult.isTransit
            ? `已檢測到：${monthDayStr} 交通班次 ${finalResult.codeNo || ''}`
            : `已檢測到：${monthDayStr} 單據`;

          setDetectedBannerText(bannerMsg);
          showToast(`🎉 ${bannerMsg}`);
        } catch (err) {
          setScanError('圖片識別遇到問題，請手動在下方確認金額與日期。');
          setScanResult({
            docType: 'EXPENSE_RECEIPT',
            summary: '請手動確認下方內容',
            hasExpense: true,
            date: defaultDate,
            amount: 0,
            region: defaultDate >= '2026-11-18' ? 'YUNNAN' : 'NANNING',
            subLocation: defaultDate >= '2026-11-18' ? '麗江' : '青秀區/萬象城',
            customSubLocation: '',
            category: 'dining',
            customCategory: '',
            paymentChannel: 'wechat',
            customPayment: '',
            note: '',
            isTransit: false,
            transitTarget: 'outboundHSR',
            codeNo: '',
            depTime: '',
            arrTime: '',
            seatNote: ''
          });
        } finally {
          setIsScanning(false);
          e.target.value = '';
        }
      };

      const applyScanResult = ({ saveExpenseNow = true, saveTransitNow = true, openFormToEdit = false }) => {
        if (!scanResult) return;
        if (saveTransitNow && scanResult.isTransit) {
          if (scanResult.transitTarget === 'outboundHSR') {
            setTransitSchedule((prev) => ({
              ...prev,
              outboundHSR: { ...prev.outboundHSR, trainNo: scanResult.codeNo || prev.outboundHSR.trainNo, depTime: scanResult.depTime || prev.outboundHSR.depTime, arrTime: scanResult.arrTime || prev.outboundHSR.arrTime }
            }));
          } else if (scanResult.transitTarget === 'lijiangFlight') {
            setTransitSchedule((prev) => ({
              ...prev,
              lijiangFlight: { ...prev.lijiangFlight, flightNo: scanResult.codeNo || prev.lijiangFlight.flightNo, depTime: scanResult.depTime || prev.lijiangFlight.depTime, arrTime: scanResult.arrTime || prev.lijiangFlight.arrTime }
            }));
          } else if (scanResult.transitTarget === 'returnHSR') {
            setTransitSchedule((prev) => ({
              ...prev,
              returnHSR: { ...prev.returnHSR, trainNo: scanResult.codeNo || prev.returnHSR.trainNo, depTime: scanResult.depTime || prev.returnHSR.depTime, arrTime: scanResult.arrTime || prev.returnHSR.arrTime }
            }));
          }
        }

        if (openFormToEdit) {
          setEditingId(null);
          setFormData({
            date: scanResult.date,
            region: scanResult.region,
            subLocation: scanResult.subLocation,
            customSubLocation: '',
            category: scanResult.category,
            customCategory: '',
            paymentChannel: scanResult.paymentChannel,
            customPayment: '',
            amount: scanResult.amount > 0 ? String(scanResult.amount) : '',
            reconciled: true,
            note: scanResult.note || ''
          });
          setShowScannerModal(false);
          setActivePage('add');
          showToast('已帶入表單微調');
          return;
        }

        if (saveExpenseNow && scanResult.amount > 0) {
          const newEntry = {
            id: `exp-ai-${Date.now()}`,
            date: scanResult.date,
            region: scanResult.region,
            subLocation: scanResult.subLocation,
            customSubLocation: '',
            category: scanResult.category,
            customCategory: '',
            paymentChannel: scanResult.paymentChannel,
            customPayment: '',
            amount: Number(Number(scanResult.amount).toFixed(2)),
            reconciled: true,
            note: scanResult.note || 'AI識別帳目'
          };
          setExpenses((prev) => [newEntry, ...prev]);
          setSelectedDate(scanResult.date);
        }

        setShowScannerModal(false);
        setActivePage('daily');
        showToast(`已成功記錄 ${formatRMB(scanResult.amount)}`);
      };

      const isOtherSubLocation = formData.subLocation.includes('其他');
      const isOtherCategory = formData.category === 'misc';
      const isOtherPayment = formData.paymentChannel === 'other_pay';

      const formatRMB = (val) => {
        const num = Number(val) || 0;
        return `¥${num.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      };

      const stats = useMemo(() => {
        let totalSpent = 0;
        let nanningSpent = 0;
        let yunnanSpent = 0;
        let reconciledTotal = 0;
        let pendingTotal = 0;

        const dailyMap = {};
        TRIP_DAYS.forEach((d) => {
          dailyMap[d.date] = { ...d, routeNote: dayRoutes[d.date] || d.defaultRoute, total: 0, count: 0, items: [] };
        });

        const byPayment = {};
        PAYMENT_CHANNELS.forEach((p) => {
          byPayment[p.id] = { ...p, total: 0, reconciled: 0, pending: 0, count: 0, items: [] };
        });

        const byCategory = {};
        CATEGORIES.forEach((c) => {
          byCategory[c.id] = { ...c, total: 0, count: 0 };
        });

        expenses.forEach((item) => {
          const amt = Number(item.amount) || 0;
          totalSpent += amt;
          if (item.region === 'NANNING') nanningSpent += amt;
          else yunnanSpent += amt;

          if (item.reconciled) reconciledTotal += amt;
          else pendingTotal += amt;

          if (dailyMap[item.date]) {
            dailyMap[item.date].total += amt;
            dailyMap[item.date].count += 1;
            dailyMap[item.date].items.push(item);
          }
          if (byPayment[item.paymentChannel]) {
            byPayment[item.paymentChannel].total += amt;
            byPayment[item.paymentChannel].count += 1;
            byPayment[item.paymentChannel].items.push(item);
            if (item.reconciled) byPayment[item.paymentChannel].reconciled += amt;
            else byPayment[item.paymentChannel].pending += amt;
          }
          if (byCategory[item.category]) {
            byCategory[item.category].total += amt;
            byCategory[item.category].count += 1;
          }
        });

        return {
          totalSpent,
          nanningSpent,
          yunnanSpent,
          reconciledTotal,
          pendingTotal,
          tenDaysList: TRIP_DAYS.map((d) => dailyMap[d.date]),
          paymentList: Object.values(byPayment),
          categoryList: Object.values(byCategory).sort((a, b) => b.total - a.total)
        };
      }, [expenses, dayRoutes]);

      const openAddPageForDay = (dayObj) => {
        setEditingId(null);
        setFormData((prev) => ({
          ...prev,
          date: dayObj.date,
          region: dayObj.defaultRegion,
          subLocation: dayObj.defaultSubLocation,
          customSubLocation: '',
          customCategory: '',
          customPayment: '',
          amount: '',
          note: ''
        }));
        setActivePage('add');
        setTimeout(() => amountInputRef.current?.focus(), 80);
      };

      const handleFormDayChange = (dayObj) => {
        setFormData((prev) => ({
          ...prev,
          date: dayObj.date,
          region: editingId ? prev.region : dayObj.defaultRegion,
          subLocation: editingId ? prev.subLocation : dayObj.defaultSubLocation
        }));
      };

      const handleRegionChange = (regionId) => {
        setFormData((prev) => ({
          ...prev,
          region: regionId,
          subLocation: REGIONS[regionId].subLocations[0],
          customSubLocation: ''
        }));
      };

      const handleSaveExpense = (e, keepAdding = false) => {
        if (e) e.preventDefault();
        const parsedAmount = parseFloat(formData.amount);
        if (isNaN(parsedAmount) || parsedAmount <= 0) {
          showToast('請輸入大於 0 的金額');
          amountInputRef.current?.focus();
          return;
        }

        const payload = {
          date: formData.date,
          region: formData.region,
          subLocation: formData.subLocation,
          customSubLocation: isOtherSubLocation ? formData.customSubLocation.trim() : '',
          category: formData.category,
          customCategory: isOtherCategory ? formData.customCategory.trim() : '',
          paymentChannel: formData.paymentChannel,
          customPayment: isOtherPayment ? formData.customPayment.trim() : '',
          amount: Number(parsedAmount.toFixed(2)),
          reconciled: formData.reconciled,
          note: formData.note.trim()
        };

        if (editingId) {
          setExpenses((prev) => prev.map((item) => (item.id === editingId ? { ...payload, id: editingId } : item)));
          setEditingId(null);
          setSelectedDate(formData.date);
          setActivePage('daily');
          showToast(`已更新帳目：${formatRMB(payload.amount)}`);
        } else {
          const newEntry = { ...payload, id: `exp-${Date.now()}` };
          setExpenses((prev) => [newEntry, ...prev]);
          setSelectedDate(formData.date);
          setFormData((prev) => ({ ...prev, amount: '', note: '', customSubLocation: '', customCategory: '', customPayment: '' }));
          if (keepAdding) {
            showToast(`已記下 ${formatRMB(payload.amount)}`);
            amountInputRef.current?.focus();
          } else {
            setActivePage('daily');
            showToast(`已新增 ${formatRMB(payload.amount)}`);
          }
        }
      };

      const handleStartEdit = (item) => {
        setEditingId(item.id);
        setFormData({
          date: item.date,
          region: item.region,
          subLocation: item.subLocation,
          customSubLocation: item.customSubLocation || '',
          category: item.category,
          customCategory: item.customCategory || '',
          paymentChannel: item.paymentChannel,
          customPayment: item.customPayment || '',
          amount: item.amount.toString(),
          reconciled: Boolean(item.reconciled),
          note: item.note || ''
        });
        setActivePage('add');
      };

      const handleDelete = (id) => {
        setExpenses((prev) => prev.filter((item) => item.id !== id));
        showToast('已刪除該筆紀錄');
      };

      const toggleReconciled = (id) => {
        setExpenses((prev) => prev.map((item) => (item.id === id ? { ...item, reconciled: !item.reconciled } : item)));
      };

      const addParkingToExpenses = () => {
        const calc = parkingStats.fullTripCalc;
        if (calc.totalMOP <= 0) {
          showToast('請確認入場時間早於離場時間');
          return;
        }
        const newEntry = {
          id: `exp-parking-${Date.now()}`,
          date: '2026-11-24',
          region: 'NANNING',
          subLocation: '珠海/青茂口岸',
          customSubLocation: '澳門青茂口岸停車場',
          category: 'local_transit',
          customCategory: '',
          paymentChannel: 'other_pay',
          customPayment: '澳門通 / MPay',
          amount: calc.totalRMB,
          reconciled: false,
          note: `青茂停車場泊車費 (MOP $${calc.totalMOP})`
        };
        setExpenses((prev) => [newEntry, ...prev]);
        showToast(`已將青茂泊車費加入 11/24 帳目`);
      };

      const downloadStandaloneHTML = () => {
        const htmlContent = getCleanIndexHTML();
        const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', 'index.html');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('已下載 index.html');
      };

      const exportToCSV = () => {
        const headers = ['天數', '日期', '星期', '地區', '地點', '類別', '支付管道', '狀態', '金額(RMB)', '備註'];
        const rows = expenses.map((e) => {
          const dayMeta = TRIP_DAYS.find((d) => d.date === e.date);
          return [dayMeta?.code || '', e.date, dayMeta?.weekday || '', REGIONS[e.region]?.shortName, `"${e.subLocation}"`, `"${e.category}"`, `"${e.paymentChannel}"`, e.reconciled ? '已核銷' : '待核對', e.amount.toFixed(2), `"${e.note || ''}"`].join(',');
        });
        const blob = new Blob(['\uFEFF' + [headers.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', 'trip_expenses.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const currentDayBucket = stats.tenDaysList.find((d) => d.date === selectedDate) || stats.tenDaysList[0];

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800 pb-24">
          <input ref={fileInputRef} type="file" accept=".json" onChange={(e) => {
            const f = e.target.files?.[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
              try {
                const p = JSON.parse(ev.target.result);
                if (p.expenses) setExpenses(p.expenses);
                showToast('匯入成功');
              } catch { showToast('格式錯誤'); }
            };
            r.readAsText(f);
          }} className="hidden" />

          <input ref={receiptImageInputRef} type="file" accept="image/*" onChange={handleUploadImageForAI} className="hidden" />

          {toastMessage && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs sm:text-sm font-bold">
              <span className="text-emerald-400">✓</span>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* AI 識別彈出視窗 */}
          {showScannerModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl space-y-4 max-h-[92vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="p-2 rounded-xl bg-emerald-100 text-emerald-700"><Icon name="sparkles" className="w-4 h-4" /></span>
                    <h3 className="text-base font-extrabold text-slate-900">AI 智慧識別單據 / 車票</h3>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button type="button" onClick={() => setShowApiKeyBox(!showApiKeyBox)} className="px-2.5 py-1 rounded-lg bg-slate-100 text-[11px] font-bold text-slate-600">
                      ⚙️ 設定API金鑰
                    </button>
                    <button onClick={() => setShowScannerModal(false)} className="w-8 h-8 rounded-full bg-slate-100 font-bold flex items-center justify-center">✕</button>
                  </div>
                </div>

                {showApiKeyBox && (
                  <div className="p-3.5 rounded-2xl bg-slate-900 text-white space-y-2 text-xs">
                    <div className="font-extrabold text-emerald-400">設定 Gemini API 金鑰 (選填)</div>
                    <input type="password" placeholder="貼上 AIzaSy... 金鑰" value={userGeminiKey} onChange={(e) => {
                      setUserGeminiKey(e.target.value);
                      try { localStorage.setItem(API_KEY_STORAGE, e.target.value.trim()); } catch {}
                    }} className="w-full rounded-xl bg-white/10 border border-white/20 px-3 py-1.5 text-xs text-white" />
                  </div>
                )}

                <div className="flex items-center justify-between gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                  {scanPreviewUrl ? <img src={scanPreviewUrl} alt="preview" className="w-16 h-16 object-cover rounded-xl" /> : <div className="w-16 h-16 rounded-xl bg-slate-200 flex items-center justify-center"><Icon name="camera" className="w-6 h-6" /></div>}
                  <div className="flex-1 min-w-0 text-xs font-bold text-slate-800">
                    {isScanning ? scanStatusText : scanResult ? '✓ 檢測完成！' : '請選擇圖片'}
                  </div>
                  <button type="button" onClick={() => receiptImageInputRef.current?.click()} disabled={isScanning} className="px-3 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold">選擇圖片</button>
                </div>

                {isScanning && (

                      </div>
                      <span className="text-[10px] font-extrabold text-emerald-700 mt-0.5">{tab.label}</span>
                    </button>
                  );
                }
                return (
                  <button key={tab.id} onClick={() => setActivePage(tab.id)} className={`py-1.5 flex flex-col items-center justify-center gap-0.5 ${activePage === tab.id ? 'text-slate-900 font-extrabold' : 'text-slate-400 font-medium'}`}>
                    <Icon name={tab.icon} className={`w-4 h-4 ${activePage === tab.id ? 'text-emerald-600' : ''}`} />
                    <span className="text-[10px]">{tab.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
